# =============================================================
#  grafana/provisioning/alerting/notification-policies.yaml
#  Políticas de notificación para TaskFlow Pro
# =============================================================

apiVersion: 1

policies:
  - orgId: 1
    receiver: taskflow-default
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: taskflow-default
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 1h
      - receiver: taskflow-default
        matchers:
          - severity = warning
        group_wait: 1m
        repeat_interval: 6h
